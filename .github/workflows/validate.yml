name: validate
on: [pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin a release tag (or a full commit SHA). Optional: with: version: 0.3.1 pins the CLI.
      - uses: jmondaut/baudrier-validate-action@v1
